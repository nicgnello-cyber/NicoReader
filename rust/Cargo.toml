[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "MIT OR Apache-2.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# le immagini si decodificano anche in debug: senza ottimizzazioni sarebbero
# dieci volte piu' lente e ogni misura fatta in debug mentirebbe
[profile.dev.package."*"]
opt-level = 3
