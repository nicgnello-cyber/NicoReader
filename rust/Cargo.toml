[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.4.7"
license = "MIT OR Apache-2.0"

[profile.release]
# "fat": tutto il programma ottimizzato come un pezzo solo. Rispetto a
# "thin" l'eseguibile e' 1,7 MB piu' leggero, e non piu' lento
lto = "fat"
codegen-units = 1
strip = true

# le immagini si decodificano anche in debug: senza ottimizzazioni sarebbero
# dieci volte piu' lente e ogni misura fatta in debug mentirebbe
[profile.dev.package."*"]
opt-level = 3

# Ottimizzati per la misura invece che per la velocita': cio' che non sta
# sulla strada delle pagine (decodifica e rimpicciolimento restano al
# massimo). L'interfaccia: finestra, caratteri e testo, scheda video
# (preparazione e shader, non il disegno), finestre di sistema, appunti,
# JSON e XML. 1,8 MB in meno, nessuna differenza che si veda o si misuri.
[profile.release.package.naga]
opt-level = "s"
[profile.release.package.wgpu]
opt-level = "s"
[profile.release.package.wgpu-core]
opt-level = "s"
