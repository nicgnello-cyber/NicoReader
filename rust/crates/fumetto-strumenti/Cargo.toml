[package]
name = "fumetto-strumenti"
description = "Gli attrezzi per fare i pacchetti: le licenze delle librerie, le icone, i volumi di prova."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
png = "0.18.1"
# per disegnare l'icona dal suo SVG, a ogni misura (solo forme: niente testo ne' immagini)
resvg = { version = "0.49.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# solo per scrivere i CBZ di prova, senza comprimere
zip = { version = "8.6.0", default-features = false }
