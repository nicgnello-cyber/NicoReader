[package]
name = "fumetto"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
# gli appunti (copia la pagina) su Windows, macOS e Linux
arboard = "3.6"
dirs = "7.0.0"
fumetto-core = { path = "../fumetto-core" }
fumetto-render = { path = "../fumetto-render" }
# salvare una pagina in PNG o JPEG
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
pollster = "1.0.1"
rfd = "0.17.2"
softbuffer = "0.4.8"
winit = "0.30"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# la jump list (jumplist.rs): le interfacce COM della shell
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }
serde_json = "1.0.151"

# i volumi aperti dal Finder (finder.rs)
[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }

[target."cfg(not(windows))".dependencies]
trash = "5.2.9"

[build-dependencies]
winresource = { version = "0.1.31", default-features = false }
