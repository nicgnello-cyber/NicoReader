[package]
name = "fumetto"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
# gli appunti (copia la pagina) su Windows, macOS e Linux
arboard = "3.6"
dirs = "7.0.0"
fumetto-core = { version = "0.1.0", path = "../fumetto-core" }
fumetto-render = { version = "0.1.0", path = "../fumetto-render" }
# salvare una pagina in PNG o JPEG
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
pollster = "1.0.1"
rfd = "0.17.2"
softbuffer = "0.4.8"
winit = "0.30"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_Shell"] }

[target."cfg(not(windows))".dependencies]
trash = "5.2.9"

[build-dependencies]
winresource = { version = "0.1.31", default-features = false }
