# I pacchetti di NicoReader per Windows x64, Windows ARM64, Linux x64 e macOS,
# fatti dagli stessi script che si usano a mano (rust/pacchetto.ps1,
# rust/pacchetto.sh, rust/pacchetto-mac.sh): per Windows lo zip e
# l'installer, per Linux il tar.gz e il .deb, per macOS il dmg. Finiscono
# negli "Artifacts" dell'esecuzione, da scaricare.
#
# Per i tag v* (git tag v0.1.0 && git push origin v0.1.0) li pubblica anche in
# una Release di GitHub, con nomi senza versione: i link del README
# (releases/latest/download/...) portano sempre all'ultima.
#
# Quando: a mano (Actions -> Pacchetti -> Run workflow, scegliendo i sistemi),
# per i tag v* e per le pull request che toccano il codice. Il repository e'
# pubblico, quindi i minuti di Actions non costano, macOS compreso.
name: Pacchetti

on:
  workflow_dispatch:
    inputs:
      sistemi:
        description: "Per quali sistemi"
        type: choice
        options: [tutti, windows, linux, macos]
        default: tutti
      note:
        description: "Solo le note della Release dell'ultima versione (niente pacchetti)"
        type: boolean
        default: false
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/pacchetti.yml"

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    if: (github.event_name != 'workflow_dispatch' || inputs.sistemi == 'tutti' || inputs.sistemi == 'windows') && !inputs.note
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      # l'assembly di rav1d, solo per x64 (su ARM64 rav1d e' senza assembly)
      - if: matrix.arch == 'x64'
        uses: ilammy/setup-nasm@v1

      # ARM64 si compila da x64: le prove girano solo su x64
      - if: matrix.arch == 'arm64'
        run: rustup target add aarch64-pc-windows-msvc

      # Inno Setup per l'installer: qui non deve mancare (a mano,
      # pacchetto.ps1 senza si ferma allo zip)
      - run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup non installato" }
        shell: pwsh

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.arch }}

      - run: ./rust/pacchetto.ps1 -Arch ${{ matrix.arch }}
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: NicoReader-windows-${{ matrix.arch }}
          path: |
            rust/dist/*.zip
            rust/dist/*-setup.exe
          if-no-files-found: error

      # clippy, senza avvisi: dopo i pacchetti, che restano comunque. Il
      # codice solo per Windows lo vede solo questo job
      - if: matrix.arch == 'x64'
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust

  linux:
    name: Linux x64
    if: (github.event_name != 'workflow_dispatch' || inputs.sistemi == 'tutti' || inputs.sistemi == 'linux') && !inputs.note
    # la glibc piu' vecchia fra quelle disponibili: l'eseguibile gira anche
    # sulle distribuzioni meno recenti
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y nasm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: ./rust/pacchetto.sh

      - uses: actions/upload-artifact@v4
        with:
          name: NicoReader-linux-x64
          path: |
            rust/dist/*.tar.gz
            rust/dist/*.deb
          if-no-files-found: error

      # clippy, senza avvisi: dopo i pacchetti, che restano comunque
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust

  macos:
    name: macOS
    if: (github.event_name != 'workflow_dispatch' || inputs.sistemi == 'tutti' || inputs.sistemi == 'macos') && !inputs.note
    # Apple Silicon: le prove girano qui, la parte Intel si compila accanto
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # l'assembly di rav1d per la parte Intel
      - run: brew install nasm

      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: ./rust/pacchetto-mac.sh

      # i volumi aperti dal Finder (application:openURLs:) arrivano davvero
      - run: ./rust/prova-finder.sh

      - uses: actions/upload-artifact@v4
        with:
          name: NicoReader-macos
          path: rust/dist/*.dmg
          if-no-files-found: error

  release:
    name: Release
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: pacchetti
          merge-multiple: true

      # i nomi fissi dei link nel README; il tag deve dire la versione del
      # programma (v0.1.0 per version = "0.1.0" in rust/Cargo.toml)
      - name: Nomi senza versione
        run: |
          versione=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$versione" ]; then
            echo "il tag $GITHUB_REF_NAME non e' la versione di Cargo.toml ($versione)" >&2
            exit 1
          fi
          mkdir uscita
          cd pacchetti
          for arch in x64 arm64; do
            mv "NicoReader-$versione-windows-$arch-setup.exe" "../uscita/NicoReader-windows-$arch-setup.exe"
            mv "NicoReader-$versione-windows-$arch.zip" "../uscita/NicoReader-windows-$arch.zip"
          done
          mv "nicoreader_${versione}_amd64.deb" ../uscita/NicoReader-linux-x64.deb
          mv "NicoReader-$versione-linux-x64.tar.gz" ../uscita/NicoReader-linux-x64.tar.gz
          mv "NicoReader-$versione-macos.dmg" ../uscita/NicoReader-macos.dmg
          ls -l ../uscita

      # le note sono in .github/note-release.md; una Release creata dal sito
      # (che crea anche il tag) con la descrizione vuota le riceve qui
      - name: Pubblica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" uscita/* --clobber
            if [ -z "$(gh release view "$GITHUB_REF_NAME" --json body -q .body)" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file .github/note-release.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" uscita/* --title "NicoReader ${GITHUB_REF_NAME#v}" --notes-file .github/note-release.md
          fi

  # a mano, con "note": riscrive le note della Release della versione in
  # rust/Cargo.toml da .github/note-release.md, senza rifare i pacchetti
  note:
    name: Note della Release
    if: github.event_name == 'workflow_dispatch' && inputs.note
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versione=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -n 1)
          gh release edit "v$versione" --notes-file .github/note-release.md
